version: v2
clean: true
plugins:
  # Go message types + Connect service handlers.
  - local: protoc-gen-go
    out: gen/go
    opt: paths=source_relative
  - local: protoc-gen-connect-go
    out: gen/go
    opt: paths=source_relative
  # TypeScript message types + service descriptors for Connect-ES v2.
  - local: protoc-gen-es
    out: ../web/src/gen
    opt:
      - target=ts
      - import_extension=none
