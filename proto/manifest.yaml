# 1Panel REST 路由 → proto RPC 映射。
# 由 `go run ./master/cmd/rpc-coverage -update-manifest` 生成初稿，人工确认后提交。
version: 1

excluded_prefixes:
  - prefix: /ai
    reason: AI 模块已剔除
  - prefix: /vms
    reason: VM 模块已剔除
  - prefix: /toolbox
    reason: Toolbox 模块已剔除
  - prefix: /hosts/tool
    reason: Toolbox 模块已剔除
  - prefix: /hosts/terminal/local
    reason: 终端数据流走 /ws/terminal WebSocket，不再是 REST 接口
  - prefix: /hosts/terminal/ssh
    reason: 终端数据流走 /ws/terminal WebSocket，不再是 REST 接口
  - prefix: /hosts/terminal/container
    reason: 终端数据流走 /ws/terminal WebSocket，不再是 REST 接口
  - prefix: /runtimes
    reason: 网站运行时已剔除
  - prefix: /websites/runtimes
    reason: 网站运行时已剔除
  - prefix: /websites/templates
    reason: 网站模板已剔除
  - prefix: /settings/license
    reason: License 已剔除
  - prefix: /enterprise
    reason: 企业版功能已剔除
  - prefix: /websites/ssl/upload
    reason: 证书文件上传是 multipart 二进制通道，保留 HTTP 实现
  - prefix: /websites/ssl/download
    reason: 证书文件下载是二进制通道，保留 HTTP 实现
  - prefix: /websites/ca/upload
    reason: CA 压缩包上传是 multipart 二进制通道，保留 HTTP 实现
  - prefix: /websites/ca/download
    reason: CA 文件下载是二进制通道，保留 HTTP 实现
  - prefix: /core/script/run
    reason: 脚本执行是 WebSocket 通道，不是 REST JSON 接口
  - prefix: /core/commands/upload
    reason: 命令 CSV 上传是 multipart 二进制通道，保留 HTTP 实现
  - prefix: /containers/search/log
    reason: 容器日志实时流是 SSE 通道，不是普通 JSON 接口
  - prefix: /containers/files
    reason: 容器文件浏览/上传/下载走二进制通道，保留 HTTP 实现
  - prefix: /containers/image/load
    reason: 镜像导入是 multipart 二进制通道
  - prefix: /containers/image/save
    reason: 镜像导出是二进制下载通道
  - prefix: /containers/download/log
    reason: 容器日志导出是二进制下载通道
  - prefix: /containers/daemonjson/file
    reason: daemon.json 文件上传下载是二进制通道
  - prefix: /databases
    reason: 数据库模块已整体剔除
  - prefix: /core/auth/api/keys
    reason: 多 API Key 管理依赖 xpack 的 APIKeyOwnerProvider，社区版未实现，随 xpack 一并剔除
  - prefix: /files/ai-search
    reason: 文件 AI 搜索依赖模型服务，mypanel 不迁移 AI 能力
  - prefix: /files/chunkdownload
    reason: 分块下载是二进制流通道，保留 HTTP 实现
  - prefix: /files/chunkupload
    reason: 分块上传是二进制流通道，保留 HTTP 实现
  - prefix: /files/download
    reason: 文件下载是二进制流通道，保留 HTTP 实现
  - prefix: /files/share/download
    reason: 分享下载是二进制流通道，保留 HTTP 实现
  - prefix: /files/share/qrcode
    reason: 分享二维码返回 PNG 图片，保留 HTTP 实现
  - prefix: /files/upload
    exact: true
    reason: 文件上传是 multipart 二进制通道，保留 HTTP 实现
  - prefix: /files/wget/process
    reason: 下载进度是 WebSocket 推送通道，不是普通 JSON 接口

