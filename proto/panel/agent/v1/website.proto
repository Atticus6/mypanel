// SearchWebsitesRequest 是网站列表查询参数。
message SearchWebsitesRequest {
  // 页码，从 1 开始。
  int32 page = 1 [(buf.validate.field).int32.gte = 1];

  // 每页条数，默认 20，最大 100。
  int32 page_size = 2 [(buf.validate.field).int32 = {
    gte: 1
    lte: 100
  }];

  // 名称或域名模糊搜索关键字，为空表示不筛选。
  string name = 3 [(buf.validate.field).string.max_len = 64];

  // 排序字段；为空时按创建时间倒序。
  string order_by = 4 [(buf.validate.field).string = {
    in: [
      "",
      "primary_domain",
      "type",
      "status",
      "createdAt",
      "expire_date",
      "created_at",
      "favorite"
    ]
  }];

  // 排序方向；为空时按倒序。
  string order = 5 [(buf.validate.field).string = {
    in: [
      "",
      "null",
      "ascending",
      "descending"
    ]
  }];

  // 网站分组 ID；0 表示不按分组筛选。
  uint32 website_group_id = 6;

  // 网站类型过滤：static=静态，proxy=反向代理，stream=四层代理，deployment=应用部署。
  string type = 7 [(buf.validate.field).string = {
    in: [
      "",
      "static",
      "proxy",
      "stream",
      "deployment"
    ]
  }];
}

// SearchWebsitesResponse 是网站列表查询结果。
message SearchWebsitesResponse {
  // 当前页的网站列表。
  repeated Website items = 1;

  // 符合条件的网站总数。
  int64 total = 2;
}

// Website 是网站的展示信息。
message Website {
  // 网站 ID，创建后不可变。
  uint32 id = 1;

  // 创建时间，RFC3339 格式，例如 2026-11-22T10:00:00+08:00。
  string created_at = 2;

  // 访问协议：http 或 https。
  string protocol = 3;

  // 主域名。
  string primary_domain = 4;

  // 网站类型：static=静态，proxy=反向代理，stream=四层代理，deployment=应用部署。
  string type = 5;

  // 网站别名，列表展示用。
  string alias = 6;

  // 备注。
  string remark = 7;

  // 运行状态：Running=运行中，Stopped=已停止，Error=异常。
  string status = 8;

  // 到期时间，RFC3339 格式；零值表示无到期时间。
  string expire_date = 9;

  // 网站根目录的绝对路径。
  string site_path = 10;

  // 关联应用名称；非应用部署站点为空。
  string app_name = 11;

  // 关联应用安装 ID；非应用部署站点为 0。
  uint32 app_install_id = 12;

  // SSL 证书到期时间，RFC3339 格式；未配置证书时为空。
  string ssl_expire_date = 13;

  // SSL 状态：success=有效，warning=10 天内到期，danger=已过期。
  string ssl_status = 14;

  // 子站点域名列表。
  repeated string child_sites = 15;

