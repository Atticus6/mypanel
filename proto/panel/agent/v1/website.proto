// panel/agent/v1/website.proto 定义网站管理域的 RPC。
syntax = "proto3";

package panel.agent.v1;

option go_package = "mypanel/proto/gen/go/panel/agent/v1;agentv1";

import "buf/validate/validate.proto";
import "panel/agent/v1/file.proto";
import "panel/common/v1/options.proto";

// WebsiteService 对应 1Panel 的网站管理域。
//
// 迁移后只保留静态站点、反向代理与四层代理；运行环境站点
// （PHP/Node/Java/Go/Python/.NET）与网站模板已从产品中移除。
service WebsiteService {
  // 分页查询网站列表，支持按名称/域名模糊搜索与类型过滤。
  rpc Search(SearchWebsitesRequest) returns (SearchWebsitesResponse) {
    option (panel.common.v1.policy) = {
      read_only: true
      no_audit: true
    };
  }

  // 读取单个网站详情。
  rpc GetWebsite(GetWebsiteRequest) returns (WebsiteDetail) {
    option (panel.common.v1.policy) = {
      read_only: true
      no_audit: true
    };
  }

  // 列出全部网站（轻量视图）。
  rpc List(ListWebsitesRequest) returns (ListWebsitesResponse) {
    option (panel.common.v1.policy) = {
      read_only: true
      no_audit: true
    };
  }

  // 列出网站名称选项，供下拉框使用。
  rpc Options(WebsiteOptionsRequest) returns (WebsiteOptionsResponse) {
    option (panel.common.v1.policy) = {
      read_only: true
      no_audit: true
    };
  }

  // 启停、重载或设置默认站点。
  rpc OperateWebsite(OperateWebsiteRequest) returns (OperateWebsiteResponse) {
    option (panel.common.v1.policy) = {
      audit_action_zh: "操作网站"
      audit_action_en: "Operate website"
    };
  }

  // 修改网站基础信息（备注、分组、到期时间等）。
  rpc UpdateWebsite(UpdateWebsiteRequest) returns (UpdateWebsiteResponse) {
    option (panel.common.v1.policy) = {
      audit_action_zh: "修改网站"
      audit_action_en: "Update website"
    };
  }

  // 创建前的依赖检查（应用、运行时等）。
  rpc Check(CheckWebsiteRequest) returns (CheckWebsiteResponse) {
    option (panel.common.v1.policy) = {
      read_only: true
      no_audit: true
    };
  }

  // 迁移分组内全部网站到新分组。
  rpc ChangeGroup(ChangeWebsiteGroupRequest) returns (ChangeWebsiteGroupResponse) {
    option (panel.common.v1.policy) = {
      audit_action_zh: "迁移网站分组"
