    option (panel.common.v1.policy) = {
      audit_action_zh: "批量操作网站"
      audit_action_en: "Batch operate websites"
    };
  }

  // 切换网站的 PHP 运行版本。
  rpc ChangePHPVersion(ChangeWebsitePHPVersionRequest) returns (ChangeWebsitePHPVersionResponse) {
    option (panel.common.v1.policy) = {
      audit_action_zh: "修改网站 PHP 版本"
      audit_action_en: "Change website PHP version"
    };
  }

  // 开启或关闭跨站访问。
  rpc OperateCrossSite(OperateCrossSiteRequest) returns (OperateCrossSiteResponse) {
    option (panel.common.v1.policy) = {
      audit_action_zh: "修改跨站访问"
