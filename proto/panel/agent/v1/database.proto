// panel/agent/v1/database.proto 定义数据库管理相关的 RPC。
syntax = "proto3";

package panel.agent.v1;

option go_package = "mypanel/proto/gen/go/panel/agent/v1;agentv1";

import "buf/validate/validate.proto";
import "panel/common/v1/options.proto";

// DatabaseService 对应 1Panel 的数据库管理域。
service DatabaseService {
  // 列出可选的数据库实例（应用安装的 MySQL/PostgreSQL/Redis 等）。
  rpc List(ListDatabasesRequest) returns (ListDatabasesResponse) {
    option (panel.common.v1.policy) = {
      read_only: true
      no_audit: true
    };
  }

  // 分页查询某个 MySQL 实例下的数据库。
  rpc SearchMySQL(SearchMySQLDatabasesRequest) returns (SearchMySQLDatabasesResponse) {
    option (panel.common.v1.policy) = {
      read_only: true
      no_audit: true
    };
  }

  // 分页查询某个 PostgreSQL 实例下的数据库。
  rpc SearchPostgreSQL(SearchPostgreSQLDatabasesRequest) returns (SearchPostgreSQLDatabasesResponse) {
    option (panel.common.v1.policy) = {
      read_only: true
      no_audit: true
    };
  }

  // 检查 Redis CLI 是否可用。
  rpc CheckRedisCli(CheckRedisCliRequest) returns (CheckRedisCliResponse) {
    option (panel.common.v1.policy) = {
      read_only: true
      no_audit: true
    };
  }

  // 列出 MySQL 实例下的用户。
  rpc ListMySQLUsers(ListMySQLUsersRequest) returns (ListMySQLUsersResponse) {
    option (panel.common.v1.policy) = {
      read_only: true
      no_audit: true
    };
  }

  // 读取 Redis 运行状态。
  rpc GetRedisStatus(RedisInstanceRequest) returns (RedisStatus) {
    option (panel.common.v1.policy) = {
      read_only: true
      no_audit: true
    };
  }

  // 读取 Redis 配置。
  rpc GetRedisConf(RedisInstanceRequest) returns (RedisConf) {
    option (panel.common.v1.policy) = {
      read_only: true
      no_audit: true
    };
  }

  // 读取 Redis 持久化配置。
  rpc GetRedisPersistenceConf(RedisInstanceRequest) returns (RedisPersistence) {
    option (panel.common.v1.policy) = {
      read_only: true
      no_audit: true
    };
  }

  // 分页查询某个 MongoDB 实例下的数据库。
  rpc SearchMongoDB(SearchMongoDBDatabasesRequest) returns (SearchMongoDBDatabasesResponse) {
    option (panel.common.v1.policy) = {
      read_only: true
      no_audit: true
    };
  }

  // 分页查询远程数据库连接（Redis、MongoDB 等）。
  rpc SearchRemote(SearchRemoteDatabasesRequest) returns (SearchRemoteDatabasesResponse) {
    option (panel.common.v1.policy) = {
      read_only: true
      no_audit: true
    };
  }
}

// ListDatabasesRequest 是数据库实例列表查询参数。
message ListDatabasesRequest {
  // 类型列表，逗号分隔，例如 mysql,mariadb。
  string type = 1 [(buf.validate.field).string.min_len = 1];
}

// ListDatabasesResponse 是数据库实例列表。
message ListDatabasesResponse {
  // 实例列表。
  repeated DatabaseOption items = 1;
}

// DatabaseOption 是一个可选的数据库实例。
message DatabaseOption {
  // 实例 ID。
  uint32 id = 1;

  // 数据库类型，例如 mysql。
  string type = 2;

  // 来源：local=本地，remote=远程。
  string from = 3;

  // 数据库名（实例名）。
  string database = 4;

  // 版本。
  string version = 5;

  // 连接地址。
  string address = 6;
}

// SearchMySQLDatabasesRequest 是 MySQL 数据库列表查询参数。
message SearchMySQLDatabasesRequest {
  // 页码，从 1 开始。
  int32 page = 1 [(buf.validate.field).int32.gte = 1];

  // 每页条数，最大 100。
  int32 page_size = 2 [(buf.validate.field).int32 = {
    gte: 1
    lte: 100
  }];

  // 数据库名关键字。
  string info = 3 [(buf.validate.field).string.max_len = 128];

  // MySQL 实例名，必须提供。
  string database = 4 [(buf.validate.field).string.min_len = 1];

  // 排序字段：name、createdAt。
  string order_by = 5 [(buf.validate.field).string = {
    in: [
      "",
      "name",
      "createdAt"
    ]
  }];

  // 排序方向：null、ascending、descending。
  string order = 6 [(buf.validate.field).string = {
    in: [
      "",
      "null",
      "ascending",
      "descending"
    ]
  }];
}

// SearchMySQLDatabasesResponse 是 MySQL 数据库列表结果。
message SearchMySQLDatabasesResponse {
  // 当前页的数据库列表。
  repeated MySQLDatabase items = 1;

  // 符合条件的数据库总数。
  int64 total = 2;
}

// MySQLDatabase 是 MySQL 数据库展示信息（不含账号密码）。
message MySQLDatabase {
  // 数据库 ID。
  uint32 id = 1;

  // 创建时间，RFC3339 格式。
  string created_at = 2;

  // 数据库名。
  string name = 3;

  // 来源：local=本地，remote=远程。
  string from = 4;

  // 所属 MySQL 实例名。
  string mysql_name = 5;

  // 字符集。
  string format = 6;

  // 排序规则。
  string collation = 7;

  // 是否已删除。
  bool is_delete = 8;

  // 备注。
  string description = 9;
}

// SearchPostgreSQLDatabasesRequest 是 PostgreSQL 数据库列表查询参数。
message SearchPostgreSQLDatabasesRequest {
  // 页码，从 1 开始。
  int32 page = 1 [(buf.validate.field).int32.gte = 1];

  // 每页条数，最大 100。
  int32 page_size = 2 [(buf.validate.field).int32 = {
    gte: 1
    lte: 100
  }];

  // 数据库名关键字。
  string info = 3 [(buf.validate.field).string.max_len = 128];

  // PostgreSQL 实例名，必须提供。
  string database = 4 [(buf.validate.field).string.min_len = 1];

  // 排序字段：name、createdAt。
  string order_by = 5 [(buf.validate.field).string = {
    in: [
      "",
      "name",
      "createdAt"
    ]
  }];

  // 排序方向：null、ascending、descending。
  string order = 6 [(buf.validate.field).string = {
    in: [
      "",
      "null",
      "ascending",
      "descending"
    ]
  }];
}

// SearchPostgreSQLDatabasesResponse 是 PostgreSQL 数据库列表结果。
message SearchPostgreSQLDatabasesResponse {
  // 当前页的数据库列表。
  repeated PostgreSQLDatabase items = 1;

  // 符合条件的数据库总数。
  int64 total = 2;
}

// PostgreSQLDatabase 是 PostgreSQL 数据库展示信息（不含账号密码）。
message PostgreSQLDatabase {
  // 数据库 ID。
  uint32 id = 1;

  // 创建时间，RFC3339 格式。
  string created_at = 2;

  // 数据库名。
  string name = 3;

  // 来源：local=本地，remote=远程。
  string from = 4;

  // 所属 PostgreSQL 实例名。
  string postgresql_name = 5;

  // 字符集。
  string format = 6;

  // 是否超级用户。
  bool super_user = 7;

  // 是否已删除。
  bool is_delete = 8;

  // 备注。
  string description = 9;
}

// SearchRemoteDatabasesRequest 是远程数据库列表查询参数。
message SearchRemoteDatabasesRequest {
  // 页码，从 1 开始。
  int32 page = 1 [(buf.validate.field).int32.gte = 1];

  // 每页条数，最大 100。
  int32 page_size = 2 [(buf.validate.field).int32 = {
    gte: 1
    lte: 100
  }];

  // 名称关键字。
  string info = 3 [(buf.validate.field).string.max_len = 128];

  // 类型列表，逗号分隔，例如 redis,mongodb。
  string type = 4 [(buf.validate.field).string.min_len = 1];

  // 排序字段：name、createdAt。
  string order_by = 5 [(buf.validate.field).string = {
    in: [
      "",
      "name",
      "createdAt"
    ]
  }];

  // 排序方向：null、ascending、descending。
  string order = 6 [(buf.validate.field).string = {
    in: [
      "",
      "null",
      "ascending",
      "descending"
    ]
  }];
}

// SearchRemoteDatabasesResponse 是远程数据库列表结果。
message SearchRemoteDatabasesResponse {
  // 当前页的数据库列表。
  repeated RemoteDatabase items = 1;

  // 符合条件的数据库总数。
  int64 total = 2;
}

// RemoteDatabase 是远程数据库连接展示信息（不含密码与证书）。
message RemoteDatabase {
  // 数据库 ID。
  uint32 id = 1;

  // 创建时间，RFC3339 格式。
  string created_at = 2;

  // 名称。
  string name = 3;

  // 类型，例如 redis、mongodb。
  string type = 4;

  // 版本。
  string version = 5;

  // 连接地址。
  string address = 6;

  // 端口。
  uint32 port = 7;

  // 初始数据库名。
  string initial_db = 8;

  // 用户名。
  string username = 9;

  // 来源：local=本地，remote=远程。
  string from = 10;

  // 是否启用 SSL。
  bool ssl = 11;

  // 是否跳过证书校验。
  bool skip_verify = 12;

  // 超时时间，单位秒。
  uint32 timeout = 13;

  // 备注。
  string description = 14;
}

// SearchMongoDBDatabasesRequest 是 MongoDB 数据库列表查询参数。
message SearchMongoDBDatabasesRequest {
  // 页码，从 1 开始。
  int32 page = 1 [(buf.validate.field).int32.gte = 1];

  // 每页条数，最大 100。
  int32 page_size = 2 [(buf.validate.field).int32 = {
    gte: 1
    lte: 100
  }];

  // 数据库名关键字。
  string info = 3 [(buf.validate.field).string.max_len = 128];

  // MongoDB 实例名，必须提供。
  string database = 4 [(buf.validate.field).string.min_len = 1];

  // 排序字段：name、createdAt。
  string order_by = 5 [(buf.validate.field).string = {
    in: [
      "",
      "name",
      "createdAt"
    ]
  }];

  // 排序方向：null、ascending、descending。
  string order = 6 [(buf.validate.field).string = {
    in: [
      "",
      "null",
      "ascending",
      "descending"
    ]
  }];
}

// SearchMongoDBDatabasesResponse 是 MongoDB 数据库列表结果。
message SearchMongoDBDatabasesResponse {
  // 当前页的数据库列表。
  repeated MongoDBDatabase items = 1;

  // 符合条件的数据库总数。
  int64 total = 2;
}

// MongoDBDatabase 是 MongoDB 数据库展示信息（不含密码）。
message MongoDBDatabase {
  // 数据库 ID。
  uint32 id = 1;

  // 创建时间，RFC3339 格式。
  string created_at = 2;

  // 数据库名。
  string name = 3;

  // 来源：local=本地，remote=远程。
  string from = 4;

  // 所属 MongoDB 实例名。
  string mongodb_name = 5;

  // 用户名。
  string username = 6;

  // 是否已删除。
  bool is_delete = 7;

  // 备注。
  string description = 8;
}

// RedisInstanceRequest 是 Redis 实例参数。
message RedisInstanceRequest {
  // 实例类型：redis 或 redis-cluster。
  string type = 1 [(buf.validate.field).string = {
    in: [
      "redis",
      "redis-cluster"
    ]
  }];

  // 实例名称。
  string database = 2 [(buf.validate.field).string.min_len = 1];
}

// RedisStatus 是 Redis 运行状态。
message RedisStatus {
  // 实例名称。
  string database = 1;

  // TCP 端口。
  string tcp_port = 2;

  // 运行天数。
  string uptime_in_days = 3;

  // 当前连接数。
  string connected_clients = 4;

  // 已用内存，单位字节。
  string used_memory = 5;

  // 进程常驻内存，单位字节。
  string used_memory_rss = 6;

  // 内存使用峰值，单位字节。
  string used_memory_peak = 7;

  // 内存碎片率。
  string mem_fragmentation_ratio = 8;

  // 累计连接数。
  string total_connections_received = 9;

  // 累计命令数。
  string total_commands_processed = 10;

  // 每秒操作数。
  string instantaneous_ops_per_sec = 11;

  // 键命中次数。
  string keyspace_hits = 12;

  // 键未命中次数。
  string keyspace_misses = 13;

  // 最近一次 fork 耗时，单位微秒。
  string latest_fork_usec = 14;
}

// RedisConf 是 Redis 配置。
message RedisConf {
  // 实例名称。
  string database = 1;

  // 名称。
  string name = 2;

  // 端口。
  int64 port = 3;

  // 容器名。
  string container_name = 4;

  // 连接超时。
  string timeout = 5;

  // 最大连接数。
  string maxclients = 6;

  // 访问密码。
  string requirepass = 7;

  // 最大内存。
  string maxmemory = 8;
}

// RedisPersistence 是 Redis 持久化配置。
message RedisPersistence {
  // 实例名称。
  string database = 1;

  // 是否启用 AOF。
  string appendonly = 2;

  // AOF 同步策略。
  string appendfsync = 3;

  // RDB 保存规则。
  string save = 4;
}

// CheckRedisCliRequest 是 Redis CLI 检查请求，无业务字段。
message CheckRedisCliRequest {}

// CheckRedisCliResponse 是 Redis CLI 可用性。
message CheckRedisCliResponse {
  // 是否可用。
  bool available = 1;
}

// ListMySQLUsersRequest 是 MySQL 用户查询参数。
message ListMySQLUsersRequest {
  // MySQL 实例名。
  string database = 1 [(buf.validate.field).string.min_len = 1];
}

// ListMySQLUsersResponse 是 MySQL 用户列表。
message ListMySQLUsersResponse {
  // 用户列表。
  repeated MySQLUser items = 1;
}

// MySQLUser 是一个 MySQL 用户（不含密码）。
message MySQLUser {
  // 用户名。
  string username = 1;

  // 允许的主机。
  string host = 2;

  // 备注。
  string description = 3;

  // 是否已删除。
  bool is_delete = 4;
}
