  string status = 1 [(buf.validate.field).string = {
    in: [
      "Enable",
      "Disable"
    ]
  }];
}

// OperateFirewallFamilyRequest 是地址族操作参数。
message OperateFirewallFamilyRequest {
  // 子系统：system、forwarding、docker。
  string subsystem = 1 [(buf.validate.field).string = {
    in: [
      "system",
      "forwarding",
      "docker"
    ]
  }];

  // 后端：iptables、nftables。
  string backend = 2 [(buf.validate.field).string = {
    in: [
      "iptables",
      "nftables"
    ]
  }];

  // 地址族：ipv4、ipv6。
  string family = 3 [(buf.validate.field).string = {
    in: [
      "ipv4",
      "ipv6"
    ]
  }];

  // 操作：initialize、repair、bind。
  string operation = 4 [(buf.validate.field).string = {
    in: [
      "initialize",
