// DockerGuardFamilyStatus 是 Docker 防护的地址族状态。
message DockerGuardFamilyStatus {
  // 是否部分可用。
  bool partial = 1;

  // 状态。
  string state = 2;

  // 原因。
  string reason = 3;

  // 是否已初始化。
  bool initialized = 4;

  // 是否已绑定。
  bool bound = 5;

  // 是否生效。
  bool effective = 6;
}

// DockerGuardBase 是 Docker 端口防护基础状态。
message DockerGuardBase {
  // 是否启用 IPv6。
  bool ipv6_enabled = 1;

  // 名称。
  string name = 2;

  // 版本。
  string version = 3;

  // 是否安装。
  bool is_exist = 4;

  // 是否已初始化。
  bool initialized = 5;

  // 是否已绑定。
  bool bound = 6;

  // IPv4 状态。
  DockerGuardFamilyStatus ipv4 = 7;

  // IPv6 状态。
  DockerGuardFamilyStatus ipv6 = 8;

  // 后端。
  string backend = 9;

  // 说明。
  string message = 10;
}

// DockerGuardEndpoint 是一个已发布端口。
message DockerGuardEndpoint {
  // 地址族。
  string family = 1;

  // 宿主机地址。
  string host_ip = 2;

  // 宿主机端口。
  uint32 host_port = 3;

  // 协议。
  string protocol = 4;

  // 容器 ID。
  string container_id = 5;

  // 容器名。
  string container_name = 6;

  // 容器状态。
  string container_state = 7;

  // 容器端口。
  uint32 container_port = 8;

  // Compose 项目名。
  string compose = 9;

  // 应用名。
  string application = 10;

  // 策略 UUID。
  string policy_uuid = 11;

  // 策略模式。
  string mode = 12;

  // 来源地址。
  repeated string sources = 13;

  // 策略是否生效。
  bool effective = 14;

  // 流量路径。
  string traffic_path = 15;

  // 管理目标。
  string management_target = 16;

  // 管理原因。
  string management_reason = 17;
}

// DockerGuardPortGroup 是按端口聚合的端点。
message DockerGuardPortGroup {
  // 聚合键。
  string key = 1;

  // 显示名。
  string label = 2;

  // 代表端点。
  DockerGuardEndpoint endpoint = 3;

  // 端点列表。
  repeated DockerGuardEndpoint endpoints = 4;
}

// DockerGuardContainer 是一个容器的端口与策略。
message DockerGuardContainer {
  // 聚合键。
  string key = 1;

  // 容器名。
  string name = 2;

  // Compose 项目名。
  string compose = 3;

  // 应用名。
  string application = 4;

  // 端点列表。
  repeated DockerGuardEndpoint endpoints = 5;

  // 按端口聚合。
  repeated DockerGuardPortGroup port_groups = 6;
}

// DockerGuardOverview 是 Docker 端口防护总览。
message DockerGuardOverview {
  // 基础状态。
  DockerGuardBase base = 1;

  // 容器列表。
  repeated DockerGuardContainer containers = 2;

  // 孤儿策略。
  repeated DockerGuardEndpoint orphan_policies = 3;
}

// GetDockerPortsRequest 是 Docker 防护总览查询参数，无业务字段。
message GetDockerPortsRequest {}

// GetDockerEndpointsRequest 是 Docker 发布端口查询参数，无业务字段。
message GetDockerEndpointsRequest {}

// DockerEndpointsResponse 是 Docker 发布端口列表。
message DockerEndpointsResponse {
  // 容器列表。
  repeated DockerGuardContainer items = 1;
}

// OperateDockerGuardRequest 是 Docker 防护操作参数。
message OperateDockerGuardRequest {
  // 备份文件。
  string backup_file = 1 [(buf.validate.field).string.max_len = 255];

  // 操作：initialize、bind、unbind。
  string operation = 2 [(buf.validate.field).string = {
    in: [
      "initialize",
      "bind",
      "unbind"
    ]
  }];

  // 任务 ID。
  string task_id = 3 [(buf.validate.field).string.max_len = 64];
}

// DockerGuardPolicy 是一条 Docker 端口防护策略。
message DockerGuardPolicy {
  // 地址族：ipv4、ipv6。
  string family = 1 [(buf.validate.field).string = {
    in: [
      "ipv4",
      "ipv6"
    ]
  }];

  // 宿主机地址。
  string host_ip = 2 [(buf.validate.field).string = {
    min_len: 1
    max_len: 45
  }];

  // 宿主机端口。
  uint32 host_port = 3 [(buf.validate.field).uint32 = {
    gt: 0
    lt: 65536
  }];

  // 协议：tcp、udp。
  string protocol = 4 [(buf.validate.field).string = {
    in: [
      "tcp",
      "udp"
    ]
  }];

  // 模式。
  string mode = 5 [(buf.validate.field).string = {
    in: [
      "deny_sources",
      "allow_sources",
      "deny_all",
      "accept_sources",
      "accept_all"
    ]
  }];

  // 来源地址。
  repeated string sources = 6;
}

// UpsertDockerPoliciesRequest 是批量更新策略参数。
message UpsertDockerPoliciesRequest {
  // 策略列表。
  repeated DockerGuardPolicy policies = 1 [(buf.validate.field).repeated.min_items = 1];

  // 是否为导入。
  bool import = 2;
}

// DeleteDockerPoliciesRequest 是批量删除策略参数。
message DeleteDockerPoliciesRequest {
  // 策略 UUID 列表。
  repeated string uuids = 1 [(buf.validate.field).repeated.min_items = 1];
}

// ListFirewallBackupsRequest 是备份列表查询参数。
message ListFirewallBackupsRequest {
  // 子系统：system、forwarding、docker。
  string subsystem = 1 [(buf.validate.field).string = {
    in: [
      "",
      "system",
      "forwarding",
      "docker"
    ]
  }];
}

// FirewallRuleBackup 是一个规则备份文件。
message FirewallRuleBackup {
  // 文件名。
  string name = 1;

  // 后端。
  string provider = 2;

  // 规则数。
  int32 rule_count = 3;

  // 修改时间（Unix 秒）。
  int64 modified_at = 4;
}

// FirewallRuleBackups 是备份文件列表。
message FirewallRuleBackups {
  // 目录。
  string directory = 1;

  // 文件列表。
  repeated FirewallRuleBackup files = 2;
}
