      "nftables"
    ]
  }];

  // 操作：select、initialize、cleanup。
  string operation = 3 [(buf.validate.field).string = {
    in: [
      "select",
      "initialize",
      "cleanup"
    ]
  }];
}

// OperateFirewallBackendResponse 是切换结果，无业务字段。
message OperateFirewallBackendResponse {}

