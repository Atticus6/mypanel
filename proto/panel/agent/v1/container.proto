// panel/agent/v1/container.proto 定义容器管理相关的 RPC。
syntax = "proto3";

package panel.agent.v1;

option go_package = "mypanel/proto/gen/go/panel/agent/v1;agentv1";

import "buf/validate/validate.proto";
import "panel/common/v1/options.proto";

// ContainerService 对应 1Panel 的容器管理域。
service ContainerService {
  // 分页查询容器。
  rpc Search(SearchContainersRequest) returns (SearchContainersResponse) {
    option (panel.common.v1.policy) = {
      read_only: true
      no_audit: true
    };
  }

  // 读取容器、镜像、网络、卷的数量统计。
  rpc Status(ContainerStatusRequest) returns (ContainerStatus) {
    option (panel.common.v1.policy) = {
      read_only: true
      no_audit: true
    };
  }

  // 分页查询镜像。
  rpc SearchImages(SearchImagesRequest) returns (SearchImagesResponse) {
    option (panel.common.v1.policy) = {
      read_only: true
      no_audit: true
    };
  }

  // 分页查询网络。
  rpc SearchNetworks(SearchNetworksRequest) returns (SearchNetworksResponse) {
    option (panel.common.v1.policy) = {
      read_only: true
      no_audit: true
    };
  }

  // 列出容器（不分页，仅名称与状态）。
  rpc ListContainers(ListContainersRequest) returns (ContainerOptions) {
    option (panel.common.v1.policy) = {
      read_only: true
      no_audit: true
    };
  }

  // 按镜像列出容器。
  rpc ListContainersByImage(ListContainersByImageRequest) returns (ContainerOptions) {
    option (panel.common.v1.policy) = {
      read_only: true
      no_audit: true
    };
  }

  // 列出容器内可用的运行用户。
  rpc GetContainerUsers(GetContainerUsersRequest) returns (ContainerUsers) {
    option (panel.common.v1.policy) = {
      read_only: true
      no_audit: true
    };
  }

  // 批量读取容器资源占用。
  rpc GetContainerStats(GetContainerStatsRequest) returns (ContainerStatsList) {
    option (panel.common.v1.policy) = {
      read_only: true
      no_audit: true
    };
  }

  // 读取单个容器的资源占用。
  rpc GetContainerItemStats(GetContainerItemStatsRequest) returns (ContainerItemStats) {
    option (panel.common.v1.policy) = {
      read_only: true
      no_audit: true
    };
  }

  // 采样一次容器实时指标（CPU、内存、IO、网络）。
  rpc SampleContainerStats(SampleContainerStatsRequest) returns (ContainerStatsSample) {
    option (panel.common.v1.policy) = {
      read_only: true
      no_audit: true
    };
  }

  // 读取 Docker 服务状态。
  rpc GetDockerStatus(GetDockerStatusRequest) returns (DockerStatus) {
    option (panel.common.v1.policy) = {
      read_only: true
      no_audit: true
    };
  }

  // 启停或重启 Docker 服务。
  rpc OperateDocker(OperateDockerRequest) returns (OperateDockerResponse) {
    option (panel.common.v1.policy) = {
      audit_action_zh: "操作 Docker"
      audit_action_en: "Operate Docker"
    };
  }

  // 拉取镜像。
  rpc PullImages(PullImagesRequest) returns (PullImagesResponse) {
    option (panel.common.v1.policy) = {
      audit_action_zh: "拉取镜像"
      audit_action_en: "Pull image"
    };
  }

  // 推送镜像到仓库。
  rpc PushImage(PushImageRequest) returns (PushImageResponse) {
    option (panel.common.v1.policy) = {
      audit_action_zh: "推送镜像"
      audit_action_en: "Push image"
    };
  }

  // 构建镜像。
  rpc BuildImage(BuildImageRequest) returns (BuildImageResponse) {
    option (panel.common.v1.policy) = {
      audit_action_zh: "构建镜像"
      audit_action_en: "Build image"
    };
  }

  // 搜索 Docker Hub 镜像。
  rpc SearchRemoteImages(SearchRemoteImagesRequest) returns (SearchRemoteImagesResponse) {
    option (panel.common.v1.policy) = {
      read_only: true
      no_audit: true
    };
  }

  // 读取 daemon.json 配置。
  rpc GetDaemonJson(GetDaemonJsonRequest) returns (DaemonJsonConf) {
    option (panel.common.v1.policy) = {
      read_only: true
      no_audit: true
    };
  }

  // 修改 daemon.json 的单项配置并重启 Docker。
  rpc UpdateDaemonJson(UpdateDaemonJsonRequest) returns (UpdateDaemonJsonResponse) {
    option (panel.common.v1.policy) = {
      audit_action_zh: "修改 Docker 配置"
      audit_action_en: "Update Docker config"
    };
  }

  // 按文件方式替换 daemon.json。
  rpc UpdateDaemonJsonByFile(UpdateDaemonJsonByFileRequest) returns (UpdateDaemonJsonByFileResponse) {
    option (panel.common.v1.policy) = {
      audit_action_zh: "替换 Docker 配置文件"
      audit_action_en: "Replace Docker config file"
    };
  }

  // 修改 Docker 日志轮转配置。
  rpc UpdateLogOption(UpdateDockerLogOptionRequest) returns (UpdateDockerLogOptionResponse) {
    option (panel.common.v1.policy) = {
      audit_action_zh: "修改 Docker 日志配置"
      audit_action_en: "Update Docker log option"
    };
  }

  // 修改 Docker IPv6 配置。
  rpc UpdateIpv6Option(UpdateDockerIpv6OptionRequest) returns (UpdateDockerIpv6OptionResponse) {
    option (panel.common.v1.policy) = {
      audit_action_zh: "修改 Docker IPv6 配置"
      audit_action_en: "Update Docker IPv6 option"
    };
  }

  // 列出全部 Compose 模板。
  rpc ListTemplates(ListComposeTemplatesRequest) returns (ComposeTemplates) {
    option (panel.common.v1.policy) = {
      read_only: true
      no_audit: true
    };
  }

  // 创建 Compose 模板。
  rpc CreateTemplate(CreateComposeTemplateRequest) returns (CreateComposeTemplateResponse) {
    option (panel.common.v1.policy) = {
      audit_action_zh: "创建 Compose 模板"
      audit_action_en: "Create compose template"
    };
  }

  // 修改 Compose 模板。
  rpc UpdateTemplate(UpdateComposeTemplateRequest) returns (UpdateComposeTemplateResponse) {
    option (panel.common.v1.policy) = {
      audit_action_zh: "修改 Compose 模板"
      audit_action_en: "Update compose template"
    };
  }

  // 批量删除 Compose 模板。
  rpc DeleteTemplates(DeleteComposeTemplatesRequest) returns (DeleteComposeTemplatesResponse) {
    option (panel.common.v1.policy) = {
      audit_action_zh: "删除 Compose 模板"
      audit_action_en: "Delete compose template"
    };
  }

  // 批量导入 Compose 模板。
  rpc BatchTemplates(BatchComposeTemplatesRequest) returns (BatchComposeTemplatesResponse) {
    option (panel.common.v1.policy) = {
      audit_action_zh: "导入 Compose 模板"
      audit_action_en: "Import compose templates"
    };
  }

  // 列出镜像仓库（选项视图）。
  rpc ListRepos(ListImageReposRequest) returns (ImageRepoOptions) {
    option (panel.common.v1.policy) = {
      read_only: true
      no_audit: true
    };
  }

  // 创建镜像仓库。
  rpc CreateRepo(CreateImageRepoRequest) returns (CreateImageRepoResponse) {
    option (panel.common.v1.policy) = {
      audit_action_zh: "创建镜像仓库"
      audit_action_en: "Create image repo"
    };
  }

  // 修改镜像仓库。
  rpc UpdateRepo(UpdateImageRepoRequest) returns (UpdateImageRepoResponse) {
    option (panel.common.v1.policy) = {
      audit_action_zh: "修改镜像仓库"
      audit_action_en: "Update image repo"
    };
  }

  // 删除镜像仓库。
  rpc DeleteRepo(DeleteImageRepoRequest) returns (DeleteImageRepoResponse) {
    option (panel.common.v1.policy) = {
      audit_action_zh: "删除镜像仓库"
      audit_action_en: "Delete image repo"
    };
  }

  // 检查镜像仓库连通性（执行登录）。
  rpc CheckRepoStatus(CheckImageRepoStatusRequest) returns (CheckImageRepoStatusResponse) {
    option (panel.common.v1.policy) = {
      audit_action_zh: "检查镜像仓库"
      audit_action_en: "Check image repo"
    };
  }

  // 读取 Docker 资源限制（CPU/内存）。
  rpc GetLimit(GetContainerLimitRequest) returns (ContainerLimit) {
    option (panel.common.v1.policy) = {
      read_only: true
      no_audit: true
    };
  }

  // 批量操作容器（启停、重启、删除等）。
  rpc OperateContainers(OperateContainersRequest) returns (OperateContainersResponse) {
    option (panel.common.v1.policy) = {
      audit_action_zh: "操作容器"
      audit_action_en: "Operate containers"
    };
  }

  // 重命名容器。
  rpc RenameContainer(RenameContainerRequest) returns (RenameContainerResponse) {
    option (panel.common.v1.policy) = {
      audit_action_zh: "重命名容器"
      audit_action_en: "Rename container"
    };
  }

  // 清理容器及其关联资源。
  rpc Prune(PruneContainersRequest) returns (PruneContainersResponse) {
    option (panel.common.v1.policy) = {
      audit_action_zh: "清理容器资源"
      audit_action_en: "Prune container resources"
    };
  }

  // 清理容器日志文件。
  rpc CleanLogs(CleanContainerLogsRequest) returns (CleanContainerLogsResponse) {
    option (panel.common.v1.policy) = {
      audit_action_zh: "清理容器日志"
      audit_action_en: "Clean container logs"
    };
  }

  // 列出网络（不分页）。
  rpc ListNetworks(ListNetworksRequest) returns (ContainerOptions) {
    option (panel.common.v1.policy) = {
      read_only: true
      no_audit: true
    };
  }

  // 创建网络。
  rpc CreateNetwork(CreateNetworkRequest) returns (CreateNetworkResponse) {
    option (panel.common.v1.policy) = {
      audit_action_zh: "创建网络"
      audit_action_en: "Create network"
    };
  }

  // 批量删除网络。
  rpc DeleteNetworks(DeleteNetworksRequest) returns (DeleteNetworksResponse) {
    option (panel.common.v1.policy) = {
      audit_action_zh: "删除网络"
      audit_action_en: "Delete network"
    };
  }

  // 列出卷（不分页）。
  rpc ListVolumes(ListVolumesRequest) returns (ContainerOptions) {
    option (panel.common.v1.policy) = {
      read_only: true
      no_audit: true
    };
  }

  // 创建卷。
  rpc CreateVolume(CreateVolumeRequest) returns (CreateVolumeResponse) {
    option (panel.common.v1.policy) = {
      audit_action_zh: "创建卷"
      audit_action_en: "Create volume"
    };
  }

  // 批量删除卷。
  rpc DeleteVolumes(DeleteVolumesRequest) returns (DeleteVolumesResponse) {
    option (panel.common.v1.policy) = {
      audit_action_zh: "删除卷"
      audit_action_en: "Delete volume"
    };
  }

  // 删除镜像。
  rpc RemoveImages(RemoveImagesRequest) returns (RemoveImagesResponse) {
    option (panel.common.v1.policy) = {
      audit_action_zh: "删除镜像"
      audit_action_en: "Remove image"
    };
  }

  // 给镜像打标签。
  rpc TagImage(TagImageRequest) returns (TagImageResponse) {
    option (panel.common.v1.policy) = {
      audit_action_zh: "镜像打标签"
      audit_action_en: "Tag image"
    };
  }

  // 读取 Compose 的 .env 文件内容。
  rpc GetComposeEnv(GetComposeEnvRequest) returns (ComposeEnv) {
    option (panel.common.v1.policy) = {
      read_only: true
      no_audit: true
    };
  }

  // 校验 Compose 文件。
  rpc TestCompose(TestComposeRequest) returns (TestComposeResponse) {
    option (panel.common.v1.policy) = {
      no_audit: true
    };
  }

  // 启停或删除 Compose 项目。
  rpc OperateCompose(OperateComposeRequest) returns (OperateComposeResponse) {
    option (panel.common.v1.policy) = {
      audit_action_zh: "操作 Compose"
      audit_action_en: "Operate compose"
    };
  }

  // 置顶/取消置顶 Compose 项目。
  rpc PinCompose(PinComposeRequest) returns (PinComposeResponse) {
    option (panel.common.v1.policy) = {
      audit_action_zh: "置顶 Compose"
      audit_action_en: "Pin compose"
    };
  }

  // 清理 Compose 日志。
  rpc CleanComposeLogs(CleanComposeLogsRequest) returns (CleanComposeLogsResponse) {
    option (panel.common.v1.policy) = {
      audit_action_zh: "清理 Compose 日志"
      audit_action_en: "Clean compose logs"
    };
  }

  // 查看容器/镜像/网络/卷的原始 inspect 信息。
  rpc Inspect(ContainerInspectRequest) returns (ContainerInspectResponse) {
    option (panel.common.v1.policy) = {
      read_only: true
      no_audit: true
    };
  }

  // 分页查询镜像仓库。
  rpc SearchImageRepos(SearchImageReposRequest) returns (SearchImageReposResponse) {
    option (panel.common.v1.policy) = {
      read_only: true
      no_audit: true
    };
  }

  // 分页查询 Compose 模板。
  rpc SearchComposeTemplates(SearchComposeTemplatesRequest) returns (SearchComposeTemplatesResponse) {
    option (panel.common.v1.policy) = {
      read_only: true
      no_audit: true
    };
  }

  // 分页查询 Compose 项目。
  rpc SearchCompose(SearchComposeRequest) returns (SearchComposeResponse) {
    option (panel.common.v1.policy) = {
      read_only: true
      no_audit: true
    };
  }

  // 分页查询卷。
  rpc SearchVolumes(SearchVolumesRequest) returns (SearchVolumesResponse) {
    option (panel.common.v1.policy) = {
      read_only: true
      no_audit: true
    };
  }
}

// SearchContainersRequest 是容器列表查询参数。
message SearchContainersRequest {
  // 页码，从 1 开始。
  int32 page = 1 [(buf.validate.field).int32.gte = 1];

  // 每页条数，最大 100。
  int32 page_size = 2 [(buf.validate.field).int32 = {
    gte: 1
    lte: 100
  }];

  // 容器名称关键字。
  string name = 3 [(buf.validate.field).string.max_len = 128];

  // 状态过滤：all、created、running、paused、restarting、removing、exited、dead。
  string state = 4 [(buf.validate.field).string = {
    in: [
      "",
      "all",
      "created",
      "running",
      "paused",
      "restarting",
      "removing",
      "exited",
      "dead"
    ]
  }];

  // Docker label 过滤表达式。
  string filters = 5;

  // 排序字段：name、createdAt、state。
  string order_by = 6 [(buf.validate.field).string = {
    in: [
      "",
      "name",
      "createdAt",
      "state"
    ]
  }];

  // 排序方向：null、ascending、descending。
  string order = 7 [(buf.validate.field).string = {
    in: [
      "",
      "null",
      "ascending",
      "descending"
    ]
  }];

  // 是否排除应用商店安装的容器。
  bool exclude_app_store = 8;
}

// SearchContainersResponse 是容器列表结果。
message SearchContainersResponse {
  // 当前页的容器列表。
  repeated Container items = 1;

  // 符合条件的容器总数。
  int64 total = 2;
}

// Container 是容器展示信息。
message Container {
  // 容器 ID。
  string container_id = 1;

  // 容器名称。
  string name = 2;

  // 镜像 ID。
  string image_id = 3;

  // 镜像名称。
  string image_name = 4;

  // 创建时间，RFC3339 格式。
  string create_time = 5;

  // 容器状态：running、exited 等。
  string state = 6;

  // 已运行时长。
  string run_time = 7;

  // 所属网络。
  repeated string network = 8;

  // 端口映射。
  repeated string ports = 9;

  // 是否来自应用商店。
  bool is_from_app = 10;

  // 是否来自 Compose。
  bool is_from_compose = 11;

  // 关联应用名称。
  string app_name = 12;

  // 关联应用安装名称。
  string app_install_name = 13;

  // 关联网站域名。
  repeated string websites = 14;

  // 是否置顶。
  bool is_pinned = 15;

  // 备注。
  string description = 16;

  // 是否有镜像更新。
  bool has_update = 17;

  // 最新版本。
  string latest_version = 18;

  // 目标镜像。
  string target_image = 19;
}

// ContainerStatusRequest 是状态统计查询参数。
message ContainerStatusRequest {
  // 是否只统计容器（跳过镜像/网络/卷），用于列表页顶部标签。
  bool containers_only = 1;
}

// ContainerStatus 是容器相关资源数量统计。
message ContainerStatus {
  // created 状态容器数。
  int32 created = 1;

  // running 状态容器数。
  int32 running = 2;

  // paused 状态容器数。
  int32 paused = 3;

  // restarting 状态容器数。
  int32 restarting = 4;

  // removing 状态容器数。
  int32 removing = 5;

  // exited 状态容器数。
  int32 exited = 6;

  // dead 状态容器数。
  int32 dead = 7;

  // 容器总数。
  int32 container_count = 8;

  // Compose 数量。
  int32 compose_count = 9;

  // Compose 模板数量。
  int32 compose_template_count = 10;

  // 镜像数量。
  int32 image_count = 11;

  // 网络数量。
  int32 network_count = 12;

  // 卷数量。
  int32 volume_count = 13;

  // 镜像仓库数量。
  int32 repo_count = 14;
}

// SearchImagesRequest 是镜像列表查询参数。
message SearchImagesRequest {
  // 页码，从 1 开始。
  int32 page = 1 [(buf.validate.field).int32.gte = 1];

  // 每页条数，最大 100。
  int32 page_size = 2 [(buf.validate.field).int32 = {
    gte: 1
    lte: 100
  }];

  // 镜像名关键字。
  string name = 3 [(buf.validate.field).string.max_len = 128];

  // 排序字段：size、tags、createdAt、isUsed。
  string order_by = 4 [(buf.validate.field).string = {
    in: [
      "",
      "size",
      "tags",
      "createdAt",
      "isUsed"
    ]
  }];

  // 排序方向：null、ascending、descending。
  string order = 5 [(buf.validate.field).string = {
    in: [
      "",
      "null",
      "ascending",
      "descending"
    ]
  }];
}

// SearchImagesResponse 是镜像列表结果。
message SearchImagesResponse {
  // 当前页的镜像列表。
  repeated Image items = 1;

  // 符合条件的镜像总数。
  int64 total = 2;
}

// Image 是一个 Docker 镜像。
message Image {
  // 镜像 ID。
  string id = 1;

  // 创建时间，RFC3339 格式。
  string created_at = 2;

  // 是否被容器使用。
  bool is_used = 3;

  // 镜像标签。
  repeated string tags = 4;

  // 镜像大小，单位字节。
  int64 size = 5;

  // 是否置顶。
  bool is_pinned = 6;

  // 备注。
  string description = 7;
}

// SearchNetworksRequest 是网络列表查询参数。
message SearchNetworksRequest {
  // 页码，从 1 开始。
  int32 page = 1 [(buf.validate.field).int32.gte = 1];

  // 每页条数，最大 100。
  int32 page_size = 2 [(buf.validate.field).int32 = {
    gte: 1
    lte: 100
  }];

  // 网络名关键字。
  string info = 3 [(buf.validate.field).string.max_len = 128];
}

// SearchNetworksResponse 是网络列表结果。
message SearchNetworksResponse {
  // 当前页的网络列表。
  repeated Network items = 1;

  // 符合条件的网络总数。
  int64 total = 2;
}

// Network 是一个 Docker 网络。
message Network {
  // 网络 ID。
  string id = 1;

  // 网络名称。
  string name = 2;

  // 标签列表，格式 key=value。
  repeated string labels = 3;

  // 驱动。
  string driver = 4;

  // IPAM 驱动。
  string ipam_driver = 5;

  // 子网。
  string subnet = 6;

  // 网关。
  string gateway = 7;

  // 创建时间，RFC3339 格式。
  string created_at = 8;

  // 是否可附加。
  bool attachable = 9;
}

// SearchVolumesRequest 是卷列表查询参数。
message SearchVolumesRequest {
  // 页码，从 1 开始。
  int32 page = 1 [(buf.validate.field).int32.gte = 1];

  // 每页条数，最大 100。
  int32 page_size = 2 [(buf.validate.field).int32 = {
    gte: 1
    lte: 100
  }];

  // 卷名关键字。
  string info = 3 [(buf.validate.field).string.max_len = 128];
}

// SearchVolumesResponse 是卷列表结果。
message SearchVolumesResponse {
  // 当前页的卷列表。
  repeated Volume items = 1;

  // 符合条件的卷总数。
  int64 total = 2;
}

// Volume 是一个 Docker 卷。
message Volume {
  // 卷名称。
  string name = 1;

  // 标签。
  repeated VolumeOption labels = 2;

  // 驱动。
  string driver = 3;

  // 挂载点。
  string mountpoint = 4;

  // 创建时间，RFC3339 格式。
  string created_at = 5;

  // 驱动参数。
  repeated VolumeOption options = 6;
}

// VolumeOption 是键值对参数。
message VolumeOption {
  // 键。
  string key = 1;

  // 值。
  string value = 2;
}

// SearchComposeRequest 是 Compose 项目查询参数。
message SearchComposeRequest {
  // 页码，从 1 开始。
  int32 page = 1 [(buf.validate.field).int32.gte = 1];

  // 每页条数，最大 100。
  int32 page_size = 2 [(buf.validate.field).int32 = {
    gte: 1
    lte: 100
  }];

  // 项目名关键字。
  string info = 3 [(buf.validate.field).string.max_len = 128];
}

// SearchComposeResponse 是 Compose 项目列表结果。
message SearchComposeResponse {
  // 当前页的项目列表。
  repeated ComposeProject items = 1;

