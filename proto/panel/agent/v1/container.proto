message GetContainerStatsRequest {
  // 容器 ID 列表；为空表示全部。
  repeated string ids = 1;
}

// ContainerStatsItem 是一个容器的资源占用。
message ContainerStatsItem {
  // 容器 ID。
  string container_id = 1;

  // 容器名。
  string container_name = 2;

  // CPU 总占用。
  uint64 cpu_total_usage = 3;

  // 系统 CPU 总时间。
  uint64 system_usage = 4;

  // CPU 百分比。
  double cpu_percent = 5;

  // 每核占用。
  int32 percpu_usage = 6;

  // 内存缓存。
  uint64 memory_cache = 7;

  // 内存占用。
  uint64 memory_usage = 8;

  // 内存上限。
  uint64 memory_limit = 9;

  // 内存百分比。
  double memory_percent = 10;
}

// ContainerStatsList 是批量资源占用结果。
message ContainerStatsList {
  // 结果列表。
  repeated ContainerStatsItem items = 1;
}

// GetContainerItemStatsRequest 是单容器占用查询参数。
message GetContainerItemStatsRequest {
  // 容器名。
  string name = 1 [(buf.validate.field).string.min_len = 1];
}

// ContainerItemStats 是容器磁盘占用与可回收空间。
message ContainerItemStats {
  // 容器可写层大小。
  int64 size_rw = 1;

  // 根文件系统大小。
  int64 size_root_fs = 2;

  // 容器占用。
  int64 container_usage = 3;

  // 容器可回收。
  int64 container_reclaimable = 4;

  // 镜像占用。
  int64 image_usage = 5;

  // 镜像可回收。
  int64 image_reclaimable = 6;

  // 卷占用。
  int64 volume_usage = 7;

  // 卷可回收。
  int64 volume_reclaimable = 8;

  // 构建缓存占用。
  int64 build_cache_usage = 9;

  // 构建缓存可回收。
  int64 build_cache_reclaimable = 10;
}

// SampleContainerStatsRequest 是实时指标采样参数。
message SampleContainerStatsRequest {
  // 容器 ID。
  string id = 1 [(buf.validate.field).string.min_len = 1];
}

// ContainerStatsSample 是一次实时指标采样。
message ContainerStatsSample {
  // CPU 百分比。
  double cpu_percent = 1;

  // 内存占用。
  double memory = 2;

  // 缓存占用。
  double cache = 3;

  // 读取速率。
  double io_read = 4;

  // 写入速率。
  double io_write = 5;

  // 网络接收速率。
  double network_rx = 6;

  // 网络发送速率。
  double network_tx = 7;

  // 采样时间，RFC3339 格式。
  string shot_time = 8;
}
