// panel/agent/v1/app.proto 定义应用商店与已安装应用相关的 RPC。
syntax = "proto3";

package panel.agent.v1;

option go_package = "mypanel/proto/gen/go/panel/agent/v1;agentv1";

import "buf/validate/validate.proto";
import "panel/common/v1/options.proto";

// AppService 对应 1Panel 的应用商店域。
service AppService {
  // 按 key 查询应用信息（含版本与标签）。
  rpc GetApp(GetAppRequest) returns (AppDetail) {
    option (panel.common.v1.policy) = {
      read_only: true
      no_audit: true
    };
  }

  // 安装应用前检查是否已存在同名安装。
  rpc CheckInstalled(CheckInstalledAppRequest) returns (AppInstalledCheck) {
    option (panel.common.v1.policy) = {
      read_only: true
      no_audit: true
    };
  }

  // 安装应用（异步，返回安装记录）。
  rpc Install(InstallAppRequest) returns (InstalledApp) {
    option (panel.common.v1.policy) = {
      audit_action_zh: "安装应用"
      audit_action_en: "Install app"
    };
  }

  // 分页查询应用商店列表。
  rpc SearchApps(SearchAppsRequest) returns (SearchAppsResponse) {
    option (panel.common.v1.policy) = {
      read_only: true
      no_audit: true
    };
  }

  // 查询已安装应用可升级的版本列表。
  rpc UpdateVersions(UpdateVersionsRequest) returns (UpdateVersionsResponse) {
    option (panel.common.v1.policy) = {
      read_only: true
      no_audit: true
    };
  }

  // 执行已安装应用操作（启动、停止、重启、升级、删除等）。
  rpc Operate(OperateAppRequest) returns (OperateAppResponse) {
    option (panel.common.v1.policy) = {
      audit_action_zh: "操作应用"
      audit_action_en: "Operate app"
    };
  }

  // 分页查询已安装应用。
  rpc SearchInstalled(SearchInstalledAppsRequest) returns (SearchInstalledAppsResponse) {
    option (panel.common.v1.policy) = {
      read_only: true
      no_audit: true
    };
  }

  // 按应用 ID、版本与类型查询应用详情。
  rpc GetAppDetail(GetAppDetailRequest) returns (AppDetailDocument) {
    option (panel.common.v1.policy) = {
      read_only: true
      no_audit: true
    };
  }

  // 按应用详情 ID 查询详情。
  rpc GetAppDetailByID(GetAppDetailByIDRequest) returns (AppDetailDocument) {
    option (panel.common.v1.policy) = {
      read_only: true
      no_audit: true
    };
  }

  // 按应用 key 与版本查询应用详情 ID。
  rpc GetAppDetailByKey(GetAppDetailByKeyRequest) returns (IdResponse) {
    option (panel.common.v1.policy) = {
      read_only: true
      no_audit: true
    };
  }

  // 查询应用商店标签。
  rpc GetAppTags(GetAppTagsRequest) returns (AppTagsResponse) {
    option (panel.common.v1.policy) = {
      read_only: true
      no_audit: true
    };
  }

  // 检查应用商店是否有更新。
  rpc GetAppUpdate(GetAppUpdateRequest) returns (AppUpdateInfo) {
    option (panel.common.v1.policy) = {
      read_only: true
      no_audit: true
    };
  }

  // 查询已忽略升级的应用。
  rpc ListIgnoredApps(ListIgnoredAppsRequest) returns (IgnoredAppsResponse) {
    option (panel.common.v1.policy) = {
      read_only: true
      no_audit: true
    };
  }

  // 忽略指定应用的升级。
  rpc IgnoreAppUpgrade(IgnoreAppUpgradeRequest) returns (IgnoreAppUpgradeResponse) {
    option (panel.common.v1.policy) = {
      audit_action_zh: "忽略应用升级"
      audit_action_en: "Ignore app upgrade"
    };
  }

  // 取消忽略应用升级。
  rpc CancelIgnoreAppUpgrade(CancelIgnoreAppUpgradeRequest) returns (CancelIgnoreAppUpgradeResponse) {
    option (panel.common.v1.policy) = {
      audit_action_zh: "取消忽略应用升级"
      audit_action_en: "Cancel ignore app upgrade"
    };
  }

  // 列出全部已安装应用的摘要。
  rpc ListInstalled(ListInstalledRequest) returns (ListInstalledResponse) {
    option (panel.common.v1.policy) = {
      read_only: true
      no_audit: true
    };
  }

  // 删除安装前检查关联资源。
  rpc CheckDeleteInstalled(CheckDeleteInstalledRequest) returns (CheckDeleteInstalledResponse) {
    option (panel.common.v1.policy) = {
      read_only: true
      no_audit: true
    };
  }

  // 同步已安装应用列表。
  rpc SyncInstalled(SyncInstalledRequest) returns (SyncInstalledResponse) {
    option (panel.common.v1.policy) = {
      audit_action_zh: "同步已安装应用"
      audit_action_en: "Sync installed apps"
    };
  }

  // 查询应用定义里的服务列表。
  rpc GetAppServices(GetAppServicesRequest) returns (GetAppServicesResponse) {
    option (panel.common.v1.policy) = {
      read_only: true
      no_audit: true
    };
  }

  // 修改已安装应用的端口。
  rpc ChangeAppPort(ChangeAppPortRequest) returns (ChangeAppPortResponse) {
    option (panel.common.v1.policy) = {
      audit_action_zh: "修改应用端口"
      audit_action_en: "Change app port"
    };
  }

  // 查询应用默认配置文件内容。
  rpc GetDefaultConfig(GetDefaultConfigRequest) returns (GetDefaultConfigResponse) {
    option (panel.common.v1.policy) = {
      read_only: true
      no_audit: true
    };
  }

  // 查询已安装应用的参数。
  rpc GetInstalledParams(GetInstalledParamsRequest) returns (InstalledParamsResponse) {
    option (panel.common.v1.policy) = {
      read_only: true
      no_audit: true
    };
  }

  // 更新已安装应用的参数与容器配置。
  rpc UpdateInstalled(UpdateInstalledRequest) returns (UpdateInstalledResponse) {
    option (panel.common.v1.policy) = {
      audit_action_zh: "修改应用参数"
      audit_action_en: "Update app params"
    };
  }

  // 更新已安装应用的 WebUI 配置。
  rpc UpdateInstalledConfig(UpdateInstalledConfigRequest) returns (UpdateInstalledConfigResponse) {
    option (panel.common.v1.policy) = {
      audit_action_zh: "修改应用配置"
      audit_action_en: "Update app config"
    };
  }

  // 查询已安装应用的运行信息。
  rpc GetInstalledInfo(GetInstalledInfoRequest) returns (InstalledInfo) {
    option (panel.common.v1.policy) = {
      read_only: true
      no_audit: true
    };
  }

  // 更新已安装应用的排序。
  rpc UpdateInstalledSort(UpdateInstalledSortRequest) returns (UpdateInstalledSortResponse) {
    option (panel.common.v1.policy) = {
      audit_action_zh: "更新应用排序"
      audit_action_en: "Update app sort"
    };
  }

  // 从远端同步应用商店列表。
  rpc SyncAppsFromRemote(SyncAppsRequest) returns (SyncAppsResponse) {
    option (panel.common.v1.policy) = {
      audit_action_zh: "同步应用商店"
      audit_action_en: "Sync app store"
    };
  }

  // 从本地同步应用商店列表。
  rpc SyncAppsFromLocal(SyncAppsRequest) returns (SyncAppsResponse) {
    option (panel.common.v1.policy) = {
      audit_action_zh: "同步本地应用"
      audit_action_en: "Sync local apps"
    };
  }

  // 查询应用可用的端口。
  rpc LoadAppPort(LoadAppPortRequest) returns (LoadAppPortResponse) {
    option (panel.common.v1.policy) = {
      read_only: true
      no_audit: true
    };
  }

  // 查询应用数据库连接信息。
  rpc LoadAppConnInfo(LoadAppConnInfoRequest) returns (LoadAppConnInfoResponse) {
    option (panel.common.v1.policy) = {
      read_only: true
      no_audit: true
    };
  }
}

// SearchAppsRequest 是应用商店查询参数。
message SearchAppsRequest {
  // 页码，从 1 开始。
  int32 page = 1 [(buf.validate.field).int32.gte = 1];

  // 每页条数，最大 100。
  int32 page_size = 2 [(buf.validate.field).int32 = {
    gte: 1
    lte: 100
  }];

  // 应用名称关键字。
  string name = 3 [(buf.validate.field).string.max_len = 64];

  // 应用类型，例如 app、runtime、website。
  string type = 4 [(buf.validate.field).string.max_len = 64];

  // 标签键列表。
  repeated string tags = 5;

  // 是否只返回推荐应用。
  bool recommend = 6;

  // 资源来源过滤：remote、local、custom、all。
  string resource = 7 [(buf.validate.field).string.max_len = 32];

  // 是否按当前 CPU 架构过滤。
  bool show_current_arch = 8;
}

// SearchAppsResponse 是应用商店列表结果。
message SearchAppsResponse {
  // 当前页的应用列表。
  repeated AppItem items = 1;

  // 符合条件的应用总数。
  int64 total = 2;
}

// AppItem 是应用商店里的一个应用。
message AppItem {
  // 应用 ID。
  uint32 id = 1;

  // 应用名称。
  string name = 2;

  // 应用键，例如 redis。
  string key = 3;

  // 图标 URL。
  string icon = 4;

  // 简介。
  string description = 5;

  // 状态。
  string status = 6;

  // 是否已安装。
  bool installed = 7;

  // 安装数量上限。
  int32 limit = 8;

  // 标签名称列表。
  repeated string tags = 9;

  // 是否支持 GPU。
  bool gpu_support = 10;

  // 推荐顺序。
  int32 recommend = 11;

  // 应用类型。
  string type = 12;

  // 是否支持批量安装。
  bool batch_install_support = 13;
}

// SearchInstalledAppsRequest 是已安装应用查询参数。
message SearchInstalledAppsRequest {
  // 页码，从 1 开始。
  int32 page = 1 [(buf.validate.field).int32.gte = 1];

  // 每页条数，最大 100。
  int32 page_size = 2 [(buf.validate.field).int32 = {
    gte: 1
    lte: 100
  }];

  // 应用名称关键字。
  string name = 3 [(buf.validate.field).string.max_len = 64];

  // 应用类型过滤。
  string type = 4 [(buf.validate.field).string.max_len = 64];

  // 标签键列表。
  repeated string tags = 5;

  // 只查询可升级的应用。
  bool update = 6;

  // 只查询未使用的应用。
  bool unused = 7;

  // 是否返回全部。
  bool all = 8;
}

// SearchInstalledAppsResponse 是已安装应用列表结果。
message SearchInstalledAppsResponse {
  // 当前页的已安装应用。
  repeated InstalledApp items = 1;

  // 符合条件的应用总数。
  int64 total = 2;
}

// InstalledApp 是一个已安装应用。
message InstalledApp {
  // 安装 ID。
  uint32 id = 1;

  // 安装名称。
  string name = 2;

  // 应用 ID。
  uint32 app_id = 3;

  // 应用详情 ID。
  uint32 app_detail_id = 4;

  // 版本。
  string version = 5;

  // 安装状态。
  string status = 6;

  // 状态说明。
  string message = 7;

  // HTTP 端口。
  int32 http_port = 8;

  // HTTPS 端口。
  int32 https_port = 9;

  // 安装目录。
  string path = 10;

  // 是否可升级。
  bool can_update = 11;

  // 图标 URL。
  string icon = 12;

  // 应用名称。
  string app_name = 13;

  // 应用键。
  string app_key = 14;

  // 应用类型。
  string app_type = 15;

  // 容器状态。
  string app_status = 16;

  // Web UI 地址。
  string web_ui = 17;

  // 创建时间，RFC3339 格式。
  string created_at = 18;

  // 是否收藏。
  bool favorite = 19;

  // 容器名。
  string container = 20;

  // 排序序号。
  int32 sort_order = 21;
}

// UpdateVersionsRequest 是升级版本查询参数。
message UpdateVersionsRequest {
  // 应用安装 ID。
  uint32 app_install_id = 1 [(buf.validate.field).uint32.gt = 0];

  // 指定版本；为空表示列出全部可升级版本。
  string update_version = 2;

  // 是否加载 Compose 预览；未设置时按服务端默认。
  optional bool load_compose = 3;
}

// UpdateVersionsResponse 是可升级版本列表。
message UpdateVersionsResponse {
  // 版本列表。
  repeated AppVersion items = 1;
}

// AppVersion 是一个可升级版本。
message AppVersion {
  // 版本号。
  string version = 1;

  // 应用详情 ID。
  uint32 detail_id = 2;

  // 该版本的 Compose 内容预览；未请求时为空。
  string docker_compose = 3;

  // 是否检测到旧版飞书配置。
  bool feishu_legacy = 4;

  // 是否已配置飞书。
  bool feishu_configured = 5;
}

// GetAppRequest 是应用查询参数。
message GetAppRequest {
  // 应用 key。
  string key = 1 [(buf.validate.field).string.min_len = 1];
}

// AppDetail 是应用详情摘要。
message AppDetail {
  // 应用 ID。
  uint32 id = 1;

  // 应用名称。
  string name = 2;

  // 应用 key。
  string key = 3;

  // 图标 URL。
  string icon = 4;

  // 简介。
  string description = 5;

  // ReadMe 内容。
  string readme = 6;

  // 可用版本列表。
  repeated string versions = 7;

  // 标签名称列表。
  repeated string tags = 8;

  // 是否已安装。
  bool installed = 9;

  // 应用类型。
  string type = 10;

  // 状态。
  string status = 11;

  // 推荐顺序。
  int32 recommend = 12;

  // 安装数量上限。
  int32 limit = 13;
}

// CheckInstalledAppRequest 是安装前检查参数。
message CheckInstalledAppRequest {
  // 应用 key。
  string key = 1 [(buf.validate.field).string.min_len = 1];

  // 计划使用的安装名称；openresty 等场景允许为空。
  string name = 2;
}

// AppInstalledCheck 是安装检查结果。
message AppInstalledCheck {
  // 关联任务 ID。
  string task_id = 1;

  // 是否已存在。
  bool is_exist = 2;

  // 安装名称。
  string name = 3;

  // 应用名称。
  string app = 4;

  // 版本。
  string version = 5;

  // 状态。
  string status = 6;

  // 创建时间，RFC3339 格式。
  string created_at = 7;

  // 最近备份时间。
  string last_backup_at = 8;

  // 安装 ID。
  uint32 app_install_id = 9;

  // 容器名。
  string container_name = 10;

  // 安装目录。
  string install_path = 11;

  // HTTP 端口。
  int32 http_port = 12;

  // HTTPS 端口。
  int32 https_port = 13;

  // 网站目录。
  string website_dir = 14;
}

// InstallAppRequest 是安装应用参数。
message InstallAppRequest {
  // 应用详情 ID。
  uint32 app_detail_id = 1 [(buf.validate.field).uint32.gt = 0];

  // 安装名称。
  string name = 2 [(buf.validate.field).string.min_len = 1];

  // 服务名映射。
  map<string, string> services = 3;

  // 前端生成的任务 ID。
  string task_id = 4;

  // 安装参数的 JSON 字符串。
  string params_json = 5;
}

// OperateAppRequest 是已安装应用操作参数。
message OperateAppRequest {
  // 安装 ID。
  uint32 install_id = 1 [(buf.validate.field).uint32.gt = 0];

  // 操作类型：start、stop、restart、upgrade、delete、sync、favorite 等。
  string operate = 2 [(buf.validate.field).string.min_len = 1];

  // 升级目标详情 ID。
  uint32 detail_id = 3;

  // 升级前是否备份。
  bool backup = 4;

  // 升级是否拉取镜像。
  bool pull_image = 5;

  // 是否删除镜像。
  bool delete_image = 6;

  // 覆盖用的 Compose 内容。
  string docker_compose = 7;

  // 前端生成的任务 ID。
  string task_id = 8;

  // 是否强制删除。
  bool force_delete = 9;

  // 删除时是否同时删除备份。
  bool delete_backup = 10;

  // 删除时是否同时删除数据库。
  bool delete_db = 11;

  // 是否收藏。
  bool favorite = 12;

  // 备份记录 ID。
  uint32 backup_id = 13;
}

// OperateAppResponse 是操作结果，无业务字段。
message OperateAppResponse {}

// GetAppDetailRequest 是应用详情查询参数。
message GetAppDetailRequest {
  // 应用 ID。
  uint32 app_id = 1 [(buf.validate.field).uint32.gt = 0];

  // 应用版本。
  string version = 2 [(buf.validate.field).string.min_len = 1];

  // 应用类型。
  string type = 3 [(buf.validate.field).string.min_len = 1];
}

// GetAppDetailByIDRequest 是按详情 ID 查询参数。
message GetAppDetailByIDRequest {
  // 应用详情 ID。
  uint32 id = 1 [(buf.validate.field).uint32.gt = 0];
}

// GetAppDetailByKeyRequest 是按 key 与版本查询参数。
message GetAppDetailByKeyRequest {
  // 应用 key。
  string app_key = 1 [(buf.validate.field).string.min_len = 1];

  // 应用版本。
  string version = 2 [(buf.validate.field).string.min_len = 1];
}

// AppDetailDocument 是应用详情的 JSON 表示。
//
// 详情里的参数值、Compose 片段结构随应用定义变化，无法稳定映射成 proto 字段，
// 因此原样序列化为 JSON，由前端按应用定义解释。
message AppDetailDocument {
  // 应用详情的 JSON 字符串。
  string detail_json = 1;
}

// IdResponse 仅返回一个 ID。
message IdResponse {
  // 目标 ID。
  uint32 id = 1;
}

// GetAppTagsRequest 是标签查询参数，无业务字段。
message GetAppTagsRequest {}

// AppTagsResponse 是标签列表结果。
message AppTagsResponse {
  // 标签列表。
  repeated AppTag items = 1;
}

// AppTag 是一个应用标签。
message AppTag {
  // 标签 ID。
  uint32 id = 1;

  // 标签键。
  string key = 2;

  // 标签名称。
  string name = 3;
}

// GetAppUpdateRequest 是应用商店更新检查参数，无业务字段。
message GetAppUpdateRequest {}

// AppUpdateInfo 是应用商店更新状态。
message AppUpdateInfo {
  // 是否有可更新内容。
  bool can_update = 1;

  // 是否正在同步。
  bool is_syncing = 2;

  // 应用商店最近修改时间戳。
  int32 app_store_last_modified = 3;

  // 应用清单的 JSON 字符串。
  string app_list_json = 4;
}

// ListIgnoredAppsRequest 是忽略列表查询参数，无业务字段。
message ListIgnoredAppsRequest {}

// IgnoredAppsResponse 是忽略升级的应用列表。
message IgnoredAppsResponse {
  // 忽略记录。
  repeated IgnoredApp items = 1;
}

// IgnoredApp 是一条忽略升级记录。
message IgnoredApp {
  // 记录 ID。
  uint32 id = 1;

  // 应用 ID。
  uint32 app_id = 2;

  // 应用详情 ID。
  uint32 app_detail_id = 3;

  // 忽略范围：all 或 version。
  string scope = 4;

  // 忽略的版本。
  string version = 5;

  // 应用名称。
  string name = 6;
}

// IgnoreAppUpgradeRequest 是忽略升级参数。
message IgnoreAppUpgradeRequest {
  // 应用 ID。
  uint32 app_id = 1 [(buf.validate.field).uint32.gt = 0];

  // 应用详情 ID。
  uint32 app_detail_id = 2;

  // 忽略范围：all 表示全部版本，version 表示指定版本。
  string scope = 3 [(buf.validate.field).string = {
    in: [
      "all",
      "version"
    ]
  }];
}

// IgnoreAppUpgradeResponse 是忽略结果，无业务字段。
message IgnoreAppUpgradeResponse {}

// CancelIgnoreAppUpgradeRequest 是取消忽略参数。
message CancelIgnoreAppUpgradeRequest {
  // 忽略记录 ID。
  uint32 id = 1 [(buf.validate.field).uint32.gt = 0];
}

// CancelIgnoreAppUpgradeResponse 是取消结果，无业务字段。
message CancelIgnoreAppUpgradeResponse {}

// ListInstalledRequest 是已安装摘要查询参数，无业务字段。
message ListInstalledRequest {}

// ListInstalledResponse 是已安装应用摘要列表。
message ListInstalledResponse {
  // 应用摘要。
  repeated InstalledAppBrief items = 1;
}

// InstalledAppBrief 是已安装应用的摘要。
message InstalledAppBrief {
  // 安装 ID。
  uint32 id = 1;

  // 应用 key。
  string key = 2;

  // 安装名称。
  string name = 3;
}

// CheckDeleteInstalledRequest 是删除前检查参数。
message CheckDeleteInstalledRequest {
  // 安装 ID。
  uint32 app_install_id = 1 [(buf.validate.field).uint32.gt = 0];
}

// CheckDeleteInstalledResponse 是关联资源列表。
message CheckDeleteInstalledResponse {
  // 关联资源。
  repeated AppResource items = 1;
}

// AppResource 是一个关联资源。
message AppResource {
  // 资源类型。
  string type = 1;

  // 资源名称。
  string name = 2;
}

// SyncInstalledRequest 是同步已安装应用参数，无业务字段。
message SyncInstalledRequest {}

// SyncInstalledResponse 是同步结果，无业务字段。
message SyncInstalledResponse {}

// GetAppServicesRequest 是服务查询参数。
message GetAppServicesRequest {
  // 应用 key。
  string key = 1 [(buf.validate.field).string.min_len = 1];
}

// GetAppServicesResponse 是应用服务列表。
message GetAppServicesResponse {
  // 服务项。
  repeated AppServiceItem items = 1;
}

// AppServiceItem 是应用定义里的一个服务。
message AppServiceItem {
  // 展示名称。
  string label = 1;

  // 服务键。
  string value = 2;

  // 来源。
  string from = 3;

  // 状态。
  string status = 4;

  // 服务配置的 JSON 字符串。
  string config_json = 5;
}

// ChangeAppPortRequest 是端口修改参数。
message ChangeAppPortRequest {
  // 应用 key。
  string key = 1;

  // 安装名称。
  string name = 2;

  // 新端口。
  int64 port = 3 [(buf.validate.field).int64.gt = 0];
}

// ChangeAppPortResponse 是修改结果，无业务字段。
message ChangeAppPortResponse {}

// GetDefaultConfigRequest 是默认配置查询参数。
message GetDefaultConfigRequest {
  // 安装名称。
  string name = 1;

  // 配置类型。
  string type = 2 [(buf.validate.field).string.min_len = 1];
}

// GetDefaultConfigResponse 是默认配置内容。
message GetDefaultConfigResponse {
  // 文件内容。
  string content = 1;
}

// GetInstalledParamsRequest 是已安装参数查询参数。
message GetInstalledParamsRequest {
  // 安装 ID。
  uint32 app_install_id = 1 [(buf.validate.field).uint32.gt = 0];
}

// InstalledParamsResponse 是已安装应用参数。
message InstalledParamsResponse {
  // 应用 key。
  string app_key = 1;

  // 安装名称。
  string name = 2;

  // HTTP 端口。
  int32 http_port = 3;

  // 是否同步模型账号。
  bool sync_model_account = 4;

  // 模型账号地址类型。
  string model_account_base_url_type = 5;

  // 模型账号地址。
  string model_account_base_url = 6;

  // 原始 Compose 内容。
  string raw_compose = 7;

  // 是否可编辑。
  bool is_edit = 8;

  // 参数列表的 JSON 字符串。
  string params_json = 9;

  // 容器配置的 JSON 字符串。
  string container_json = 10;
}

// UpdateInstalledRequest 是已安装参数更新参数。
//
// 参数与容器配置字段随应用定义变化，前端直接回传原请求体，这里用 JSON 透传。
message UpdateInstalledRequest {
  // 安装 ID。
  uint32 install_id = 1 [(buf.validate.field).uint32.gt = 0];

  // 原始请求体的 JSON 字符串。
  string payload_json = 2 [(buf.validate.field).string.min_len = 1];
}

// UpdateInstalledResponse 是更新结果，无业务字段。
message UpdateInstalledResponse {}

// UpdateInstalledConfigRequest 是 WebUI 配置更新参数。
message UpdateInstalledConfigRequest {
  // 安装 ID。
  uint32 install_id = 1 [(buf.validate.field).uint32.gt = 0];

  // WebUI 地址。
  string web_ui = 2;
}

// UpdateInstalledConfigResponse 是更新结果，无业务字段。
message UpdateInstalledConfigResponse {}

// GetInstalledInfoRequest 是运行信息查询参数。
message GetInstalledInfoRequest {
  // 安装 ID。
  uint32 app_install_id = 1 [(buf.validate.field).uint32.gt = 0];
}

// InstalledInfo 是已安装应用的运行信息。
message InstalledInfo {
  // 安装 ID。
  uint32 id = 1;

  // 安装名称。
  string name = 2;

  // 版本。
  string version = 3;

  // 状态。
  string status = 4;

  // 状态说明。
  string message = 5;

  // HTTP 端口。
  int32 http_port = 6;

  // 容器名。
  string container = 7;

  // Compose 文件路径。
  string compose_path = 8;

  // 应用 key。
  string app_key = 9;

  // 应用端口列表。
  repeated int32 app_ports = 10;

  // 环境变量的 JSON 字符串。
  string env_json = 11;
}

// UpdateInstalledSortRequest 是排序更新参数。
message UpdateInstalledSortRequest {
  // 排序项。
  repeated InstalledSortItem items = 1 [(buf.validate.field).repeated.min_items = 1];
}

// InstalledSortItem 是一条排序记录。
message InstalledSortItem {
  // 安装 ID。
  uint32 install_id = 1 [(buf.validate.field).uint32.gt = 0];

  // 排序序号。
  int32 sort_order = 2;
}

// UpdateInstalledSortResponse 是更新结果，无业务字段。
message UpdateInstalledSortResponse {}

// SyncAppsRequest 是应用商店同步参数。
message SyncAppsRequest {
  // 前端生成的任务 ID。
  string task_id = 1;
}

// SyncAppsResponse 是同步结果。
message SyncAppsResponse {
  // 无需同步时返回的提示文案；已启动同步任务时为空。
  string message = 1;
}

// LoadAppPortRequest 是端口查询参数。
message LoadAppPortRequest {
  // 安装名称。
  string name = 1;

  // 应用类型。
  string type = 2 [(buf.validate.field).string.min_len = 1];
}

// LoadAppPortResponse 是可用端口。
message LoadAppPortResponse {
  // 端口号。
  int64 port = 1;
}

// LoadAppConnInfoRequest 是数据库连接查询参数。
message LoadAppConnInfoRequest {
  // 安装名称。
  string name = 1;

  // 应用类型。
  string type = 2 [(buf.validate.field).string.min_len = 1];
}

// LoadAppConnInfoResponse 是数据库连接信息。
message LoadAppConnInfoResponse {
  // 连接状态。
  string status = 1;

  // 用户名。
  string username = 2;

  // 密码。
  string password = 3;

  // 容器名。
  string container_name = 4;

  // 服务名。
  string service_name = 5;

  // 端口。
  int64 port = 6;
}
