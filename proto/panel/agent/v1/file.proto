  string path = 2 [(buf.validate.field).string.min_len = 1];

  // 保存文件名。
  string name = 3 [(buf.validate.field).string.min_len = 1];

  // 是否忽略证书错误。
  bool ignore_certificate = 4;

  // 是否使用代理。
  bool use_proxy = 5;

  // 是否使用服务端返回的文件名。
  bool use_server_filename = 6;
}

// WgetResponse 是远程下载任务启动结果。
message WgetResponse {
  // 任务键，用于查询进度或停止任务。
  string key = 1;
}

// StopWgetRequest 是停止远程下载参数。
message StopWgetRequest {
  // 任务键。
  string key = 1 [(buf.validate.field).string.min_len = 1];
}

// StopWgetResponse 是停止结果，无业务字段。
message StopWgetResponse {}

// GetWgetProcessKeysRequest 是下载任务键查询参数，无业务字段。
message GetWgetProcessKeysRequest {}

// GetWgetProcessKeysResponse 是下载任务键列表。
message GetWgetProcessKeysResponse {
  // 任务键。
  repeated string keys = 1;
}

// RemoveWgetRecordsRequest 是移除下载记录参数。
message RemoveWgetRecordsRequest {
  // 任务键列表。
  repeated string keys = 1 [(buf.validate.field).repeated = {
    min_items: 1
    max_items: 1000
  }];
}

// RemoveWgetRecordsResponse 是移除后剩余的下载记录键。
message RemoveWgetRecordsResponse {
  // 剩余任务键。
  repeated string keys = 1;
}
