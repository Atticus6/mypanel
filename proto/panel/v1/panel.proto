syntax = "proto3";

package panel.v1;

option go_package = "mypanel/proto/gen/go/panel/v1;panelv1";

// PanelService 是 master 控制面的起步服务。
service PanelService {
  // Ping 是 unary 的健康检查/回显调用。
  rpc Ping(PingRequest) returns (PingResponse);

  // Hello 是最小示例：接收一个名字，返回一句问候。
  rpc Hello(HelloRequest) returns (HelloResponse);

  // ListEvents 是分页查询示例，用于演示前端无限查询。
  rpc ListEvents(ListEventsRequest) returns (ListEventsResponse);

  // Watch 按调用方指定的周期持续推送事件。
  rpc Watch(WatchRequest) returns (stream WatchEvent);
}

message PingRequest {
  string message = 1;
}

message PingResponse {
  string message = 1;
  string server_time = 2;
  string version = 3;
}

message HelloRequest {
  // 被问候的名字。为空时服务端使用 "world"。
  string name = 1;
}

message HelloResponse {
  // 拼好的问候语，例如 "Hello, atticus!"。
  string greeting = 1;
  string server_time = 2;
}

message WatchRequest {
  // 事件间隔秒数。<= 0 时回退到服务端默认值。
  int32 interval_seconds = 1;
}

message WatchEvent {
  int64 seq = 1;
  string at = 2;
  string kind = 3;
}

message ListEventsRequest {
  // 上一页返回的 next_page_token；首页留空。
  string page_token = 1;
  // 每页条数。<= 0 时使用服务端默认值。
  int32 page_size = 2;
}

message ListEventsResponse {
  repeated WatchEvent events = 1;
  // 下一页的游标；为空表示没有更多数据。
  string next_page_token = 2;
}
