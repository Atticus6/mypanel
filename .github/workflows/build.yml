name: build

# 在 push / PR 以及手动触发时构建并打包；推送 v* 标签时顺便创建 Release 并上传产物。
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 Go
        uses: actions/setup-go@v5
        with:
          # 版本取自 go.mod，避免 workflow 与项目声明漂移。
          go-version-file: master/go.mod
          cache: false

      - name: 安装 Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: 安装前端依赖
        working-directory: web
        run: bun install --frozen-lockfile

      - name: 构建（前端 + master 二进制）
        run: bash scripts/build.sh

      - name: 打包产物
        id: pack
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME:-dev}"
          pkg="mypanel-${version}-linux-amd64"
          dir="dist-pkg/$pkg"
          mkdir -p "$dir"
          install -m 755 bin/master "$dir/master"
          cp config.yaml "$dir/config.yaml"
          install -m 755 scripts/install.sh "$dir/install.sh"
          install -m 755 scripts/mypanelctl "$dir/mypanelctl"
          cp README.md LICENSE NOTICE "$dir/"
          tar -czf "$pkg.tar.gz" -C dist-pkg "$pkg"
          echo "asset=$pkg.tar.gz" >> "$GITHUB_OUTPUT"

      - name: 上传构建产物
        uses: actions/upload-artifact@v4
        with:
          name: mypanel-linux-amd64
          path: '*.tar.gz'
          if-no-files-found: error

      - name: 创建 Release 并上传安装包
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: '*.tar.gz'
          generate_release_notes: true
