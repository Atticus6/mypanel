# master 运行配置
#
# 优先级（高到低）：
#   命令行参数 > 环境变量 > config.local.yaml > 本文件 > 内置默认值
#
# 环境变量统一带 MYPANEL_ 前缀，例如：
#   MYPANEL_ADDR=:9000 ./bin/master
# 会覆盖本文件里的 addr。
#
# 个人/本机改动请写进同目录的 config.local.yaml（已 gitignore），
# 不要改这个文件——它是入库的默认值。
#
# 字段与说明见 AGENTS.md 的「配置」一节。

# HTTP 监听地址。生产环境通常放 0.0.0.0 后面接反向代理。
addr: ":8080"

# 前端产物目录。
# 留空表示使用编译进二进制的版本（生产推荐）；
# 开发时可指向 ../web/dist，改完前端只需重启进程。
web_dir: ""

# 打开 gin 调试模式：会打印路由表，仅用于本地排查。
debug: false

# 优雅退出的最长等待时间，给未结束的流式 RPC 留出收尾时间。
shutdown_timeout: "5s"

# 面板数据目录：core/agent 的数据库、日志、密钥都写在其下。
# 指向已有 1Panel 安装目录时（例如 /opt），可直接复用原有数据。
data_dir: "./data"

# 首次启动创建的管理员账号；已有数据库时不会覆盖。
admin_user: "admin"

# 首次启动创建的管理员密码；留空则随机生成并在启动日志里打印一次。
# 生产环境请用环境变量 MYPANEL_ADMIN_PASSWORD 或 config.local.yaml 配置。
admin_password: ""

# 面板升级 / 应用商店的发布源根地址（这里设为本项目自己的发布地址）。
# 留空时用内置的原版 1Panel 官方地址；想临时切换可用环境变量覆盖下面的字段。
# 优先级：MYPANEL_UPGRADE_* 环境变量 > 本文件字段 > 内置原版官方地址。
# 三个地址分别对应：升级包与版本文件、升级资源、应用商店资源。
upgrade_repo_url: "https://github.com/Atticus6/mypanel/releases/download"
upgrade_resource_url: "https://github.com/Atticus6/mypanel/releases/download"
upgrade_app_url: "https://github.com/Atticus6/mypanel/releases/download"
