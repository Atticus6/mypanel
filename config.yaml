# master 运行配置
#
# 优先级（高到低）：
#   命令行参数 > 环境变量 > config.local.yaml > 本文件 > 内置默认值
#
# 环境变量统一带 MYPANEL_ 前缀，例如：
#   MYPANEL_ADDR=:9000 ./bin/master
# 会覆盖本文件里的 addr。
#
# 个人/本机改动请写进同目录的 config.local.yaml（已 gitignore），
# 不要改这个文件——它是入库的默认值。
#
# 字段与说明见 AGENTS.md 的「配置」一节。

# HTTP 监听地址。生产环境通常放 0.0.0.0 后面接反向代理。
addr: ":8080"

# 前端产物目录。
# 留空表示使用编译进二进制的版本（生产推荐）；
# 开发时可指向 ../web/dist，改完前端只需重启进程。
web_dir: ""

# 打开 gin 调试模式：会打印路由表，仅用于本地排查。
debug: false

# 优雅退出的最长等待时间，给未结束的流式 RPC 留出收尾时间。
shutdown_timeout: "5s"
